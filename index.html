<!doctype html>
<html lang="gu" data-theme="teal-slate" data-appearance="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        var appearance = localStorage.getItem('rm-app-appearance')
        var scheme = appearance === 'dark' ? 'only dark' : 'only light'
        document.documentElement.style.colorScheme = scheme
        document.documentElement.setAttribute(
          'data-appearance',
          appearance === 'dark' ? 'dark' : 'light',
        )
        var colorSchemeMeta = document.querySelector('meta[name="color-scheme"]')
        if (colorSchemeMeta) colorSchemeMeta.content = scheme
        var supportedMeta = document.querySelector('meta[name="supported-color-schemes"]')
        if (supportedMeta) supportedMeta.content = appearance === 'dark' ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Room Management" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap"
      />
    </noscript>
    <title>Room Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
